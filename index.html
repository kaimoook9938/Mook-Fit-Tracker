<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mook Fit Tracker</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

  <h1>🥗 Mook Fit Tracker</h1>
  <p class="subtitle">โปรตีนขั้นต่ำ 55g | แคลไม่เกิน 1300 kcal</p>

  <label>📅 วันที่</label>
  <input id="date" type="date">

  <label>🍽️ อาหาร</label>
  <input id="food" type="text" placeholder="เช่น อกไก่ย่าง">

  <label>💪 โปรตีน (กรัม)</label>
  <input id="protein" type="number">

  <label>🔥 แคลอรี่ (kcal)</label>
  <input id="calorie" type="number">

  <button class="addBtn" onclick="addFood()">
    ➕ เพิ่มอาหาร
  </button>

  <div class="summary">

    <h3>💪 โปรตีน</h3>

    <p><span id="proteinTotal">0</span> / 55 g</p>

    <div class="progress">
      <div id="proteinBar" class="bar protein"></div>
    </div>

    <p id="proteinStatus">เหลืออีก 55 g ถึงขั้นต่ำ</p>

    <hr>

    <h3>🔥 แคลอรี่</h3>

    <p><span id="calorieTotal">0</span> / 1300 kcal</p>

    <div class="progress">
      <div id="calorieBar" class="bar calorie"></div>
    </div>

    <p id="calorieStatus">เหลือกินได้อีก 1300 kcal</p>

  </div>

  <h3>📋 อาหารวันนี้</h3>

  <ul id="foodList"></ul>

  <button onclick="resetToday()">🗑️ ล้างข้อมูลวันนี้</button>

  <button onclick="exportMonthData()">📤 ส่งออกข้อมูลเดือนนี้</button>

  <button class="addBtn" onclick="toggleMonthlySummary()">
    📊 สรุปเดือน
    <span id="summaryArrow">▼</span>
  </button>

  <div id="monthlySummary" style="display:none;"></div>

</div>

<script src="script.js"></script>

</body>
</html>
